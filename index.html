<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BOOMBIT — Mixed Reality Confusion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Background effect -->
<canvas id="bg-canvas"></canvas>

<!-- Scanline overlay -->
<div class="scanlines"></div>

<!-- Progress bar -->
<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<div id="game-container">

  <!-- ═══ INTRO ═══ -->
  <div id="intro-screen" class="screen active">
    <div class="title-glitch" data-text="BOOMBIT">BOOMBIT</div>
    <div class="subtitle">Mixed Reality Confusion</div>
    <p class="intro-desc">
      현실인가, 가상인가.<br>
      경계가 무너진 세계에서<br>
      당신의 선택이 당신을 정의합니다.
    </p>
    <button class="btn start-btn" id="btn-start">▶ 시작하기</button>
  </div>

  <!-- ═══ NARRATION ═══ -->
  <div id="narration-screen" class="screen">
    <div class="chapter-badge" id="chapter-badge"></div>
    <h2 class="scene-title" id="scene-title"></h2>
    <div class="narration-box" id="narration-box"></div>
    <div class="continue-hint">[ 탭하여 계속 ]</div>
  </div>

  <!-- ═══ CHOICE ═══ -->
  <div id="choice-screen" class="screen">
    <p class="question-text" id="question-text"></p>
    <div class="choices-container" id="choices-container"></div>
  </div>

  <!-- ═══ RESPONSE ═══ -->
  <div id="response-screen" class="screen">
    <div class="response-text" id="response-text"></div>
    <button class="btn" id="btn-continue" style="margin-top:30px;">계속 →</button>
  </div>

  <!-- ═══ QUIZ ═══ -->
  <div id="quiz-screen" class="screen">
    <div class="quiz-title" id="quiz-title"></div>
    <p class="quiz-question" id="quiz-question"></p>
    <p class="quiz-hint" id="quiz-hint"></p>
    <div class="quiz-input-wrap">
      <input type="text" class="quiz-input" id="quiz-input" placeholder="답을 입력하세요" autocomplete="off">
      <button class="btn btn-primary" id="btn-quiz-submit">확인</button>
    </div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
  </div>

  <!-- ═══ RESULT ═══ -->
  <div id="result-screen" class="screen">
    <div class="result-icon" id="result-icon"></div>
    <h2 class="result-title" id="result-title"></h2>
    <div class="result-primary-trait" id="result-primary-trait"></div>
    <div class="result-card">
      <p class="result-desc" id="result-desc"></p>
      <div class="result-meta">
        <span>강점: <strong id="result-strength"></strong></span>
        <span>약점: <strong id="result-weakness"></strong></span>
      </div>
      <p class="result-quote" id="result-quote"></p>
      <div class="trait-bars" id="trait-bars"></div>
    </div>
    <button class="btn start-btn" id="btn-restart" style="margin-top:30px;">🔄 다시 도전</button>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
